<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>هوش مصنوعی پیشرفته و هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <aside class="w-64 glass border-l border-white/10 p-6 flex flex-col">
        <h1 class="text-xl font-bold text-sky-400 mb-8 flex items-center gap-2">دستیار هوشمند</h1>
        <nav class="space-y-3 text-sm">
            <button onclick="showTab('chat')" class="w-full text-right p-3 rounded-xl hover:bg-white/10 transition">گفتگوی تعاملی</button>
            <button onclick="showTab('keys')" class="w-full text-right p-3 rounded-xl hover:bg-white/10 transition">کلیدهای API</button>
        </nav>
    </aside>
    <main class="flex-1 p-8 overflow-y-auto">
        <div id="tab-chat" class="h-full flex flex-col glass rounded-3xl p-6">
            <h2 class="text-xl font-bold mb-4">گفتگوی هوشمند</h2>
            <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 pr-2">
                <div class="text-right"><span class="glass p-3 rounded-xl inline-block text-sm">سلام! من پیش‌نمایش رابط کاربری هوش مصنوعی شما هستم. تمامی منوها و بخش‌ها آماده‌اند.</span></div>
            </div>
            <div class="flex gap-4 mt-4">
                <input type="text" placeholder="پیام خود را بنویسید..." class="flex-1 bg-white/5 border border-white/10 p-4 rounded-xl">
                <button class="bg-sky-600 px-8 rounded-xl font-bold">ارسال</button>
            </div>
        </div>
        <div id="tab-keys" class="hidden glass rounded-3xl p-6">
            <h2 class="text-xl font-bold mb-4">مدیریت کلیدهای API</h2>
        </div>
    </main>
    <script>
        function showTab(name) {
            document.getElementById('tab-chat').classList.toggle('hidden', name !== 'chat');
            document.getElementById('tab-keys').classList.toggle('hidden', name !== 'keys');
        }
    </script>
</body>
</html>
